on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    container:
      image: archlinux:latest
    steps:
      - name: base-devel
        run:  pacman -Syyu base-devel --noconfirm
      - name: git
        run:  pacman -Syyu git --noconfirm

      - name: Checkout
        uses: actions/checkout@v4

      - name: safe.directory
        run:  git config --global --add safe.directory /__w/uv-k5-firmware-custom/uv-k5-firmware-custom

      - name: Run host-side spectrum tests
        run:  ./tools/host_tests/build.sh

      - name: Run host-side ARDF DF-Simple tests
        run:  ./tools/host_tests/build_ardf_df_simple.sh

      - name: Run host-side German band-list tests
        run:  ./tools/host_tests/build_band_list_de.sh

  build:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: base-devel
        run:  pacman -Syyu base-devel --noconfirm
      - name: arm-none-eabi-gcc
        run:  pacman -Syyu arm-none-eabi-gcc --noconfirm
      - name: arm-none-eabi-newlib
        run:  pacman -Syyu arm-none-eabi-newlib --noconfirm
      - name: git
        run:  pacman -Syyu git --noconfirm
      - name: python-pip
        run:  pacman -Syyu python-pip --noconfirm
      - name: python-crcmod
        run:  pacman -Syyu python-crcmod --noconfirm      

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: safe.directory
        run:  git config --global --add safe.directory /__w/uv-k5-firmware-custom/uv-k5-firmware-custom        
      - name: Make
        run:  make
      - name: size
        run:  arm-none-eabi-size firmware_uvk5_v1

      - name: 'Upload Artifact'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware*.bin

      - name: Upload binaries to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: firmware_uvk5_v1.packed.bin
          asset_name: egzumer_$tag.packed.bin
          tag: ${{ github.ref }}
          overwrite: true
          release_name: release ${{ github.ref_name }}     
   
